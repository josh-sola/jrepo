[package]
name = "wt-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
clap = { version = "4.6.4", features = ["derive"] }
fs4 = "1.1.0"
kdl = "6.7"
miette = { version = "7.6", features = ["fancy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24.0", features = ["serde", "v7"] }
