[package]
name = "viz-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ab_glyph = "0.2"
kdl = { version = "6", features = ["v1-fallback"] }
miette = "7"
petgraph = "0.8"
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series", "area_series", "point_series", "histogram", "ab_glyph"] }
roxmltree = "0.21"
rust-sugiyama = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
usvg = { version = "0.50", default-features = false, features = ["text"] }

[dev-dependencies]
tempfile = "3"
