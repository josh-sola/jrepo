[package]
name = "viz"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
kdl = { version = "6", features = ["v1-fallback"] }
miette = { version = "7", features = ["fancy"] }
notify = "8"
petgraph = "0.8"
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series", "area_series", "point_series", "histogram", "ab_glyph"] }
pulldown-cmark = { version = "0.13", default-features = false }
rand = "0.9"
ratatui = "0.30"
resvg = "0.50"
roxmltree = "0.21"
rust-sugiyama = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

[dev-dependencies]
tempfile = "3"
