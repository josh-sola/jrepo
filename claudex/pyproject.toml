[project]
name = "jrepo-claudex"
version = "0.1.0"
description = "Run Claude Code through a local ChatGPT-backed LiteLLM gateway"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "litellm[proxy]==1.97.0",
  # Later FastAPI releases removed get_flat_dependant, which LiteLLM 1.97.0 imports.
  "fastapi==0.136.3",
  "typer==0.26.5",
]

[project.scripts]
claudex = "claudex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claudex"]
